<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" role="img" aria-label="garden illustration">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f8f3"/>
      <stop offset="0.55" stop-color="#eaf1ee"/>
      <stop offset="1" stop-color="#e2ebef"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="340" fill="url(#bg)"/>
  <rect y="210" width="1200" height="130" fill="url(#glow)"/>

  <!-- 远景柔和色块 -->
  <ellipse cx="1010" cy="290" rx="330" ry="90" fill="#cfe0d6" opacity="0.35"/>
  <ellipse cx="150" cy="320" rx="300" ry="80" fill="#d8e6df" opacity="0.4"/>

  <!-- 主茎：左侧 -->
  <g stroke="#4a7c59" stroke-width="2.4" fill="none" stroke-linecap="round">
    <path d="M 205 330 C 200 260, 208 190, 196 120"/>
    <path d="M 205 262 C 176 250, 156 236, 142 214"/>
    <path d="M 202 216 C 232 206, 252 192, 266 172"/>
    <path d="M 198 172 C 172 162, 156 150, 146 132"/>
    <path d="M 196 120 C 220 112, 238 100, 248 84"/>
  </g>
  <!-- 主茎叶片 -->
  <g fill="#5d8f6d" opacity="0.9">
    <ellipse cx="138" cy="208" rx="17" ry="8" transform="rotate(-32 138 208)"/>
    <ellipse cx="270" cy="167" rx="17" ry="8" transform="rotate(-38 270 167)"/>
    <ellipse cx="142" cy="127" rx="15" ry="7" transform="rotate(-30 142 127)"/>
    <ellipse cx="252" cy="79" rx="15" ry="7" transform="rotate(-42 252 79)"/>
    <path d="M 196 120 C 190 96, 194 76, 205 58 C 213 78, 210 100, 203 122 Z"/>
  </g>
  <g fill="#88b04b" opacity="0.75">
    <ellipse cx="158" cy="242" rx="12" ry="6" transform="rotate(-28 158 242)"/>
    <ellipse cx="248" cy="120" rx="11" ry="5.5" transform="rotate(-36 248 120)"/>
  </g>

  <!-- 次茎：右侧，更矮 -->
  <g stroke="#6e9981" stroke-width="2.2" fill="none" stroke-linecap="round">
    <path d="M 960 336 C 966 280, 958 230, 972 186"/>
    <path d="M 962 280 C 936 270, 920 258, 912 240"/>
    <path d="M 968 240 C 994 232, 1010 220, 1018 204"/>
  </g>
  <g fill="#7fae94" opacity="0.85">
    <ellipse cx="908" cy="236" rx="14" ry="7" transform="rotate(-30 908 236)"/>
    <ellipse cx="1022" cy="200" rx="14" ry="7" transform="rotate(-36 1022 200)"/>
    <path d="M 972 186 C 966 164, 970 146, 980 130 C 988 148, 985 168, 977 188 Z"/>
  </g>

  <!-- 小苗：中间偏左 -->
  <g stroke="#88b04b" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M 560 336 C 560 316, 560 300, 560 288"/>
    <path d="M 560 300 C 546 294, 538 286, 534 274"/>
    <path d="M 560 296 C 574 290, 582 282, 586 270"/>
  </g>
  <g fill="#a4c68f" opacity="0.9">
    <ellipse cx="530" cy="271" rx="11" ry="5.5" transform="rotate(-34 530 271)"/>
    <ellipse cx="590" cy="267" rx="11" ry="5.5" transform="rotate(32 590 267)"/>
  </g>

  <!-- 飘散的种子/光点 -->
  <g fill="#4a7c59">
    <circle cx="700" cy="120" r="3" opacity="0.35"/>
    <circle cx="760" cy="90" r="2.2" opacity="0.3"/>
    <circle cx="820" cy="140" r="2.6" opacity="0.28"/>
    <circle cx="360" cy="100" r="2.4" opacity="0.3"/>
    <circle cx="420" cy="70" r="2" opacity="0.25"/>
    <circle cx="1080" cy="120" r="2.6" opacity="0.3"/>
    <circle cx="1120" cy="180" r="2" opacity="0.25"/>
  </g>

  <!-- 地平线 -->
  <path d="M 60 330 C 300 318, 500 326, 700 322 C 900 318, 1050 324, 1140 320" stroke="#9db8a6" stroke-width="1.6" fill="none" opacity="0.5" stroke-linecap="round"/>
</svg>
