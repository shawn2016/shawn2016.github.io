<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" font-family="-apple-system, 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">
  <!-- 背景 -->
  <rect width="1200" height="480" fill="#f7f8f5"/>
  <!-- 细网格 -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e8ebe4" stroke-width="1"/>
  </pattern>
  <rect width="1200" height="480" fill="url(#grid)"/>

  <!-- 左面板：按风格逛 -->
  <g>
    <rect x="40" y="50" width="520" height="380" rx="16" fill="#ffffff" stroke="#dfe3da" stroke-width="1.5"/>
    <text x="72" y="98" font-size="24" font-weight="700" fill="#8a8f86">按风格逛</text>
    <text x="72" y="126" font-size="15" fill="#9aa096">入口是「好看」，出口是收藏夹</text>

    <!-- 散落的卡片 -->
    <g opacity="0.9">
      <rect x="80" y="160" width="88" height="150" rx="10" fill="#eef0ea" stroke="#d8dcd2"/>
      <rect x="200" y="150" width="88" height="150" rx="10" fill="#f2ede4" stroke="#ddd6c8"/>
      <rect x="330" y="170" width="88" height="150" rx="10" fill="#eaf0ee" stroke="#d3ded8"/>
      <rect x="450" y="155" width="88" height="150" rx="10" fill="#f0ebe6" stroke="#ddd4cc"/>
      <rect x="140" y="330" width="88" height="70" rx="10" fill="#eef0ea" stroke="#d8dcd2"/>
      <rect x="290" y="335" width="88" height="70" rx="10" fill="#f2ede4" stroke="#ddd6c8"/>
      <rect x="430" y="330" width="88" height="70" rx="10" fill="#eaf0ee" stroke="#d3ded8"/>
    </g>
    <!-- 游移的路径 -->
    <path d="M 100 240 C 160 180, 220 290, 280 220 S 380 160, 430 260 S 500 350, 540 300"
          fill="none" stroke="#b9bfb4" stroke-width="2.5" stroke-dasharray="6 7" stroke-linecap="round"/>
    <!-- 问号终点 -->
    <circle cx="540" cy="300" r="16" fill="none" stroke="#b9bfb4" stroke-width="2"/>
    <text x="540" y="307" font-size="20" font-weight="700" fill="#b9bfb4" text-anchor="middle">?</text>
    <text x="300" y="425" font-size="15" fill="#9aa096" text-anchor="middle">没有目的地，路径随机，产出：50 张收藏</text>
  </g>

  <!-- 中间箭头 -->
  <g>
    <line x1="585" y1="240" x2="645" y2="240" stroke="#2f6b5a" stroke-width="3" stroke-linecap="round"/>
    <path d="M 645 240 l -12 -8 v 16 z" fill="#2f6b5a"/>
  </g>

  <!-- 右面板：按问题查 -->
  <g>
    <rect x="660" y="50" width="500" height="380" rx="16" fill="#ffffff" stroke="#cfdcd4" stroke-width="1.5"/>
    <text x="692" y="98" font-size="24" font-weight="700" fill="#2f6b5a">按问题查</text>
    <text x="692" y="126" font-size="15" fill="#7c8a80">入口是「任务」，出口是解法</text>

    <!-- 问题框 -->
    <rect x="692" y="160" width="200" height="52" rx="10" fill="#2f6b5a"/>
    <text x="792" y="192" font-size="16" font-weight="600" fill="#ffffff" text-anchor="middle">会员购买页怎么做</text>

    <!-- 箭头 -->
    <line x1="792" y1="212" x2="792" y2="248" stroke="#2f6b5a" stroke-width="2.5"/>
    <path d="M 792 252 l -7 -11 h 14 z" fill="#2f6b5a"/>

    <!-- 横排解法卡片 -->
    <g>
      <rect x="692" y="262" width="86" height="140" rx="10" fill="#eef4f0" stroke="#9dbfab" stroke-width="1.5"/>
      <rect x="692" y="262" width="86" height="26" rx="10" fill="#40916c"/>
      <rect x="700" y="271" width="46" height="8" rx="4" fill="#ffffff" opacity="0.85"/>
      <rect x="806" y="262" width="86" height="140" rx="10" fill="#eef4f0" stroke="#9dbfab" stroke-width="1.5"/>
      <rect x="806" y="262" width="86" height="26" rx="10" fill="#52a57e"/>
      <rect x="814" y="271" width="46" height="8" rx="4" fill="#ffffff" opacity="0.85"/>
      <rect x="920" y="262" width="86" height="140" rx="10" fill="#eef4f0" stroke="#9dbfab" stroke-width="1.5"/>
      <rect x="920" y="262" width="86" height="26" rx="10" fill="#2f6b5a"/>
      <rect x="928" y="271" width="46" height="8" rx="4" fill="#ffffff" opacity="0.85"/>
      <rect x="1034" y="262" width="86" height="140" rx="10" fill="#eef4f0" stroke="#9dbfab" stroke-width="1.5"/>
      <rect x="1034" y="262" width="86" height="26" rx="10" fill="#6bb392"/>
      <rect x="1042" y="271" width="46" height="8" rx="4" fill="#ffffff" opacity="0.85"/>
    </g>
    <text x="906" y="432" font-size="15" fill="#5f7268" text-anchor="middle">同类真实产品的解法摊开横比，产出：一个可用的方案</text>
  </g>
</svg>
