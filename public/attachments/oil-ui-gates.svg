<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 748" font-family="-apple-system, 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">
  <rect width="640" height="748" fill="#f7f8f5"/>
  <pattern id="g" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#e8ebe4" stroke-width="1"/>
  </pattern>
  <rect width="640" height="748" fill="url(#g)"/>

  <text x="24" y="44" font-size="18" font-weight="700" fill="#303c35">五道关卡，没过不往前走</text>
  <text x="24" y="68" font-size="13.5" fill="#8a8f86">每一关都要交出一份别人能看见的证据</text>

  <!-- 1 -->
  <rect x="24" y="92" width="592" height="104" rx="12" fill="#ffffff" stroke="#dfe3da" stroke-width="1.5"/>
  <circle cx="52" cy="126" r="14" fill="#2f6b5a"/>
  <text x="52" y="131" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <text x="80" y="123" font-size="16" font-weight="700" fill="#303c35">拆标杆</text>
  <text x="80" y="149" font-size="14" fill="#606b60">拿到同类真实画面，拆出 6–10 条看得见的要素</text>
  <text x="80" y="174" font-size="13.5" fill="#2f6b5a">门槛 · 只写「干净、留白」就是没拆到位，换一家</text>

  <!-- 2 -->
  <rect x="24" y="210" width="592" height="104" rx="12" fill="#ffffff" stroke="#dfe3da" stroke-width="1.5"/>
  <circle cx="52" cy="244" r="14" fill="#2f6b5a"/>
  <text x="52" y="249" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <text x="80" y="241" font-size="16" font-weight="700" fill="#303c35">方向卡</text>
  <text x="80" y="267" font-size="14" fill="#606b60">形容词翻成色值、字族、间距、控件语法</text>
  <text x="80" y="292" font-size="13.5" fill="#2f6b5a">门槛 · 翻不出可观察的值的词，从理由里删掉</text>

  <!-- 3 -->
  <rect x="24" y="328" width="592" height="104" rx="12" fill="#ffffff" stroke="#dfe3da" stroke-width="1.5"/>
  <circle cx="52" cy="362" r="14" fill="#2f6b5a"/>
  <text x="52" y="367" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
  <text x="80" y="359" font-size="16" font-weight="700" fill="#303c35">灰度线框</text>
  <text x="80" y="385" font-size="14" fill="#606b60">先定唯一主角与主动作，在灰度里排清层级</text>
  <text x="80" y="410" font-size="13.5" fill="#2f6b5a">门槛 · 灰度里看不出主角，先重写结构</text>

  <!-- 4 -->
  <rect x="24" y="446" width="592" height="104" rx="12" fill="#ffffff" stroke="#dfe3da" stroke-width="1.5"/>
  <circle cx="52" cy="480" r="14" fill="#2f6b5a"/>
  <text x="52" y="485" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
  <text x="80" y="477" font-size="16" font-weight="700" fill="#303c35">真实截图</text>
  <text x="80" y="503" font-size="14" fill="#606b60">目标视口跑起来，100% 和 200% 各看一次</text>
  <text x="80" y="528" font-size="13.5" fill="#2f6b5a">门槛 · 没看过真实画面，不算做过视觉验收</text>

  <!-- 5 -->
  <rect x="24" y="564" width="592" height="104" rx="12" fill="#ffffff" stroke="#dfe3da" stroke-width="1.5"/>
  <circle cx="52" cy="598" r="14" fill="#2f6b5a"/>
  <text x="52" y="603" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
  <text x="80" y="595" font-size="16" font-weight="700" fill="#303c35">独立评审</text>
  <text x="80" y="621" font-size="14" fill="#606b60">换一个没参与制作、没看过代码的评审者</text>
  <text x="80" y="646" font-size="13.5" fill="#2f6b5a">门槛 · 能派而没派，不算做完这一步</text>

  <!-- 返工回路 -->
  <rect x="24" y="684" width="592" height="44" rx="12" fill="#eef0ea" stroke="#c2c9bc" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="44" y="712" font-size="13" fill="#2f6b5a">判「重做」时回方向卡重定骨架，不在错的骨架上修补</text>
</svg>
