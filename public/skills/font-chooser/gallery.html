.status{font-size:12px;color:#6b7280;margin:0 0 12px;min-height:17px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:13px 15px 15px;

.card:hover{border-color:#4f7cff;box-shadow:0 3px 14px rgba(79,124,255,.10)}
.meta{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.meta b{font-size:13px;font-weight:650}
.meta span{font-size:10.5px;color:#9aa1ab;font-family:ui-monospace,SFMono-Regular,monospace}
.sub{font-size:11px;color:#89919c;margin:3px 0 11px;min-height:15px}
.big{font-size:var(--size);line-height:1.3;white-space:nowrap;overflow:hidden;color:#111}
.small{font-size:14px;color:#4b5563;margin-top:7px;white-space:nowrap;overflow:hidden}
.hint{font-size:10.5px;color:#aeb4bd;margin-top:9px}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
     background:#1a1d21;color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;
     opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
#toast.on{opacity:1}
</style>

<h1>中文字体速览 · 看图选字</h1>
<div class="desc">输入你自己的文案，看每款字体真实的字形（浏览器直连字体酱公开分片，免 Key、跨站可用）。<br>
点任意卡片即可复制该字体的 &lt;link&gt; 引用代码，直接贴进设计稿；字体 id 也可交给 <code>font_lookup.py</code> 查表。<br>
【与静态图册的区别】本页用远程分片，支持输入任意文字（浏览器按需取片）；切换分组首次加载约需 1–2 秒，字体到位后会自动重绘。若预览面板拦截了外部请求，请用浏览器直接打开本文件。</div>
<div class="bar">
  <input id="text" type="text" value="字体样张" placeholder="输入要预览的文字">
  <select id="group"></select>
  <label class="rng">字号 <input id="size" type="range" min="24" max="72" value="42"> <b id="sizev">42</b>px</label>
</div>
<div class="status" id="status">准备中…</div>
<div class="grid" id="grid"></div>
<div id="toast">已复制引用代码</div>

function esc(s){ return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function render(ids, text){
  grid.innerHTML = ids.map((id, i) => {
    const f = BY[id]; if(!f) return '';
    const st = 'font-family:"' + f.cssFamily + '",sans-serif;font-weight:' + f.weight + ';';
    return '<div class="card" data-id="' + esc(f.id) + '">' +
      '<div class="meta"><b>#' + (i+1) + ' ' + esc(f.name) + '</b><span>' + esc(f.id) + '</span></div>' +
      '<div class="sub">' + esc(f.style) + ' · 适用 ' + esc(f.use) + '</div>' +
      '<div class="big" style="' + st + '">' + esc(text) + '</div>' +
      '<div class="small" style="' + st + '">春风又绿江南岸 · 2026 · ¥1,234.56</div>' +
      '<div class="hint">点击复制引用代码</div></div>';
  }).join('');
}

function addLink(f){
  return new Promise(res => {
    if(loaded.has(f.id)) return res();
    const l = document.createElement('link');
    l.rel = 'stylesheet'; l.href = f.css;
    let done = false;
    const fin = () => { if(done) return; done = true; loaded.add(f.id); res(); };
    l.onload = fin; l.onerror = fin;
    document.head.appendChild(l);
    setTimeout(fin, 10000);
  });
}

  }
  const t = document.getElementById('toast');
  t.textContent = '已复制 ' + f.name + ' 的引用代码';
  t.classList.add('on'); setTimeout(() => t.classList.remove('on'), 1800);
});

showGroup(sel.value);
</script>
</body>
