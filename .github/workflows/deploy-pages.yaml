name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # L2 加密页：从仓库 Secret 注入真实密码，仓库中只存占位符
      - name: Inject note password
        env:
          NOTE_PASSWORD: ${{ secrets.NOTE_PASSWORD }}
        run: |
          if [ -n "$NOTE_PASSWORD" ]; then
            python3 inject_password.py
          else
            echo "NOTE_PASSWORD 未设置，加密页将使用占位符密码构建"
          fi

      - name: Build
        run: pnpm build

      - name: Restore password placeholder
        if: always()
        env:
          NOTE_PASSWORD: ${{ secrets.NOTE_PASSWORD }}
        run: |
          if [ -n "$NOTE_PASSWORD" ]; then
            python3 inject_password.py --restore
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
